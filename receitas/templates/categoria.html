<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Receitas da categoria {{ categoria.nome }}</h1>
{% if receitas %}
    {% for receita in receitas %}
    <ul><li><a href="{% url 'exibir_receita' receita.id %}">{{receita.nome}}</a></li>
        {%endfor%}

    </ul>
{% else %}
<p>Não</p>

{% endif %}
</body>
</html>
